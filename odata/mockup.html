<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>ODATA QR03 · System (demo)</title>
<style>
:root{--bg:#0b1015;--panel:#111a22;--panel2:#0e161d;--line:#1f2c37;--ink:#e8eef2;--soft:#9fb2c0;--mute:#6b8090;
--cyan:#35c2c9;--amber:#e8a13a;--green:#4fbf8b;--red:#e56a6a;--violet:#9a8cff;}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,sans-serif}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header .t{font-weight:700} header .t b{color:var(--cyan)} header .proj{color:var(--soft);font-size:13px;font-family:ui-monospace,Consolas,monospace}
.badge{margin-left:auto;font-size:11px;color:var(--green);border:1px solid var(--green);border-radius:20px;padding:3px 10px}
.badge.demo{color:var(--amber);border-color:var(--amber);margin-left:8px}
nav{display:flex;gap:4px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel2)}
nav button{background:transparent;border:1px solid transparent;color:var(--soft);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
nav button:hover{color:var(--ink)} nav button.on{background:var(--panel);color:var(--cyan);border-color:var(--line)}
main{padding:20px 22px;max-width:1200px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .n{font-size:34px;font-weight:800;line-height:1}.kpi .l{color:var(--soft);font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
.kpi .s{font-size:12px;margin-top:4px}
h2{font-size:16px;margin:26px 0 12px;font-weight:700}h2 span{color:var(--mute);font-weight:600;font-size:13px}
h3{font-size:13px;color:var(--soft);margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-family:ui-monospace,Consolas,monospace}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700}
.ok{background:rgba(79,191,139,.15);color:var(--green)}.warn{background:rgba(232,161,58,.15);color:var(--amber)}.bad{background:rgba(229,106,106,.16);color:var(--red)}.mut{background:rgba(155,140,255,.14);color:var(--violet)}
.bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;border-radius:6px}
.row-fx{display:flex;gap:6px;align-items:center}
.sub{color:var(--soft);font-size:13px;margin:0 0 6px}
.flag{border-left:3px solid var(--red)}
.legend{font-size:12px;color:var(--mute);margin-top:8px}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.callout{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--soft)}
.footer{color:var(--mute);font-size:11px;padding:14px 22px;border-top:1px solid var(--line);font-family:ui-monospace,Consolas,monospace}
</style></head><body>
<header>
  <div><div class="t">ODATA QR03 · <b>Single Source of Truth</b></div><div class="proj" id="projlbl"></div></div>
  <span class="badge">● live</span><span class="badge demo">DEMO · simulated data</span>
</header>
<nav id="nav"></nav>
<main id="view"></main>
<div class="footer">Interactive demo · simulated data to illustrate the system · d3x.biz/odata · Turner &amp; Townsend</div>
<script>
const DATA = {"proj": "OBDMX-QR03 · Phase 1 (200 MW)", "areas": [{"id": "DH1", "name": "Data Hall 1", "fis": 72, "fin": 78, "disc": "MEP+CSA"}, {"id": "DH2", "name": "Data Hall 2", "fis": 38, "fin": 41, "disc": "MEP+CSA"}, {"id": "SE1", "name": "Electrical Room 1", "fis": 25, "fin": 80, "disc": "MEP", "flag": true, "gc": 40}, {"id": "BAT", "name": "Battery Room", "fis": 54, "fin": 57, "disc": "MEP"}, {"id": "YRD", "name": "Yard / Exterior works", "fis": 61, "fin": 59, "disc": "CSA"}], "lines": {"DH1": [["L001 Main AC duct", "MEP", "m", 120, 96, "units"], ["L002 Cable tray", "MEP", "m", 200, 150, "units"], ["L003 Partition wall", "CSA", "m²", 340, 300, "units"], ["L004 Raised floor", "CSA", "m²", 500, 320, "weighted"]], "DH2": [["L010 AC duct", "MEP", "m", 120, 40, "units"], ["L011 Cable tray", "MEP", "m", 200, 72, "units"], ["L012 Wall", "CSA", "m²", 340, 150, "units"]], "SE1": [["L020 MV switchboards", "MEP", "pcs", 8, 2, "steps"], ["L021 Conduit", "MEP", "m", 90, 70, "units"], ["L022 Earthing bar", "MEP", "m", 60, 15, "units"]], "BAT": [["L030 Battery racks", "MEP", "pcs", 24, 13, "units"], ["L031 Ventilation", "MEP", "m", 80, 44, "units"]], "YRD": [["L040 Paving", "CSA", "m²", 1200, 760, "units"], ["L041 Drainage", "CSA", "m", 300, 180, "units"]]}, "packages": [{"id": "IWP-DH1-03", "area": "DH1", "type": "IWP", "released": true, "constraints": 0}, {"id": "IWP-DH2-01", "area": "DH2", "type": "IWP", "released": false, "constraints": 2, "cnote": "material + drawing rev"}, {"id": "IWP-SE1-02", "area": "SE1", "type": "IWP", "released": false, "constraints": 1, "cnote": "switchboards in factory"}, {"id": "IWP-BAT-01", "area": "BAT", "type": "IWP", "released": true, "constraints": 0}, {"id": "IWP-YRD-04", "area": "YRD", "type": "IWP", "released": true, "constraints": 0}], "costcodes": [{"cc": "CSA-CONCRETE", "bud": 8200, "com": 8000, "act": 6100, "eac": 8300}, {"cc": "CSA-FINISHES", "bud": 3400, "com": 3100, "act": 1200, "eac": 3350}, {"cc": "MEP-DUCTS", "bud": 3500, "com": 3400, "act": 2100, "eac": 3700}, {"cc": "MEP-PIPING", "bud": 2600, "com": 2500, "act": 1500, "eac": 2600}, {"cc": "ELEC-SWITCHGEAR", "bud": 5200, "com": 5000, "act": 4400, "eac": 5600}, {"cc": "ELEC-UPS", "bud": 4100, "com": 4000, "act": 1900, "eac": 4050}], "evm": {"period": ["W1", "W2", "W3", "W4", "W5", "W6", "W7", "W8"], "pv": [1200, 3100, 5600, 8900, 12500, 16200, 19800, 23000], "ev": [1000, 2800, 5100, 8200, 11400, 14800, 18100, 20900], "ac": [1100, 3000, 5500, 8800, 12300, 16000, 19600, 22300]}, "gcs": [{"gc": "Norte Construction", "est": "EST-08", "period": "Aug", "monto": 4200, "cfdi": "OK", "recon": "reconciled"}, {"gc": "MEP Solutions", "est": "EST-06", "period": "Aug", "monto": 2600, "cfdi": "OK", "recon": "reconciled"}, {"gc": "Electro QR", "est": "EST-05", "period": "Aug", "monto": 3100, "cfdi": "OK", "recon": "DISCREPANCY", "note": "billing 40% vs 25% physical in SE1"}], "commx": [{"sys": "UPS-A", "L1": "ok", "L2": "ok", "L3": "ok", "L4": "ok", "L5": "pend"}, {"sys": "UPS-B", "L1": "ok", "L2": "ok", "L3": "ok", "L4": "pend", "L5": "pend"}, {"sys": "Delta³ Cooling", "L1": "ok", "L2": "ok", "L3": "pend", "L4": "pend", "L5": "pend"}, {"sys": "MV Switchboard SE1", "L1": "ok", "L2": "pend", "L3": "pend", "L4": "pend", "L5": "pend"}, {"sys": "Fire detection", "L1": "ok", "L2": "ok", "L3": "ok", "L4": "ok", "L5": "ok"}], "issues": {"ncr_open": 4, "rfi_open": 7, "punch_open": 23, "constraints_open": 3}, "kpi": {"fisico": 52, "financiero": 61, "cpi": 0.94, "spi": 0.91, "hitos_atraso": 2, "paquetes_liberados": 3, "paquetes_total": 5}};
document.getElementById('projlbl').textContent = DATA.proj;
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;};
const pct=(v)=>v+'%'; const money=(v)=>'$'+v.toLocaleString()+'k';
const barColor=(v)=>v>=66?'var(--green)':v>=33?'var(--amber)':'var(--red)';
function bar(v,c){return `<div class="bar"><i style="width:${Math.min(v,100)}%;background:${c||barColor(v)}"></i></div>`;}
function pill(txt,cls){return `<span class="pill ${cls}">${txt}</span>`;}

// ---- SVG charts (no libs) ----
function svgLine(series, w=560, h=180){
  const all=[].concat(...Object.values(series.data)); const max=Math.max(...all)*1.08;
  const n=series.labels.length, pad=34;
  const X=i=>pad+i*(w-pad-10)/(n-1), Y=v=>h-24-(v/max)*(h-44);
  let out=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  for(let g=0;g<=4;g++){const yy=24+g*(h-48)/4;out+=`<line x1="${pad}" y1="${yy}" x2="${w-10}" y2="${yy}" stroke="#1f2c37"/>`;}
  series.labels.forEach((l,i)=>out+=`<text x="${X(i)}" y="${h-6}" fill="#6b8090" font-size="10" text-anchor="middle">${l}</text>`);
  const cols={pv:'#9a8cff',ev:'#4fbf8b',ac:'#e8a13a'};
  for(const k in series.data){const d=series.data[k];let p='';d.forEach((v,i)=>p+=(i?'L':'M')+X(i)+' '+Y(v)+' ');
    out+=`<path d="${p}" fill="none" stroke="${cols[k]||'#35c2c9'}" stroke-width="2.5"/>`;
    d.forEach((v,i)=>out+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${cols[k]||'#35c2c9'}"/>`);}
  out+='</svg>';return out;
}
function svgBars(items, w=560, h=200){ // items:[{label,v}]
  const max=100,pad=30,n=items.length,bw=(w-pad-10)/n*0.62;
  let out=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  const X=i=>pad+i*(w-pad-10)/n+((w-pad-10)/n-bw)/2, Y=v=>h-22-(v/max)*(h-40);
  items.forEach((it,i)=>{const y=Y(it.v),bh=h-22-y;
    out+=`<rect x="${X(i)}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${it.c||'#35c2c9'}"/>`;
    out+=`<text x="${X(i)+bw/2}" y="${y-5}" fill="#e8eef2" font-size="11" text-anchor="middle">${it.v}%</text>`;
    out+=`<text x="${X(i)+bw/2}" y="${h-6}" fill="#6b8090" font-size="10" text-anchor="middle">${it.label}</text>`;});
  out+='</svg>';return out;
}
function gauge(v,label,color){ // 0-100 style but shows ratio
  const r=42,c=2*Math.PI*r,off=c*(1-Math.min(v,1.3)/1.3);
  return `<svg viewBox="0 0 120 120" width="120" height="120">
   <circle cx="60" cy="60" r="${r}" fill="none" stroke="#1f2c37" stroke-width="10"/>
   <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
     stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/>
   <text x="60" y="58" fill="#e8eef2" font-size="22" font-weight="800" text-anchor="middle">${v.toFixed(2)}</text>
   <text x="60" y="76" fill="#9fb2c0" font-size="10" text-anchor="middle">${label}</text></svg>`;
}

// ---- VIEWS ----
const V = {};
V["Summary"]=()=>{const k=DATA.kpi,is=DATA.issues;
  return `
  <div class="grid g4">
    ${kpiCard(k.fisico+'%','Physical progress','verified on site','var(--green)')}
    ${kpiCard(k.financiero+'%','Financial progress','from the ledger','var(--amber)')}
    ${kpiCard(k.cpi,'CPI (cost)',k.cpi>=1?'on budget':'over cost',k.cpi>=1?'var(--green)':'var(--red)')}
    ${kpiCard(k.spi,'SPI (schedule)',k.spi>=1?'on schedule':'behind',k.spi>=1?'var(--green)':'var(--amber)')}
  </div>
  <h2>The 40 / 25 / 80 <span>· the discrepancy the system catches on its own</span></h2>
  <div class="callout flag">In <b>Electrical Room 1</b>: the GC bills <b style="color:var(--amber)">40%</b> (estimate) · site reports <b style="color:var(--green)">25%</b> verified physical · cost is <b style="color:var(--red)">80%</b> spent. Three untagged truths. The system tags them, ties each to its owner, and <b>flags the discrepancy</b> before it reaches the client report. → see the Reconciliation tab.</div>
  <h2>S-curve · Earned Value <span>(USD thousands, cumulative)</span></h2>
  <div class="card">${svgLine({labels:DATA.evm.period,data:{pv:DATA.evm.pv,ev:DATA.evm.ev,ac:DATA.evm.ac}})}
    <div class="legend"><span style="color:var(--violet)">■</span> PV (planned) &nbsp; <span style="color:var(--green)">■</span> EV (earned) &nbsp; <span style="color:var(--amber)">■</span> AC (actual). EV below PV = behind; AC above EV = over cost.</div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Physical progress by area</h3>${svgBars(DATA.areas.map(a=>({label:a.id,v:a.fis,c:a.flag?'var(--red)':'var(--cyan)'})))}</div>
    <div class="card"><h3>Project status</h3>
      <table><tr><td>AWP packages released (constraint-free)</td><td class="num">${k.paquetes_liberados}/${k.paquetes_total}</td></tr>
      <tr><td>Milestones behind</td><td class="num">${pill(k.hitos_atraso,'warn')}</td></tr>
      <tr><td>NCRs open</td><td class="num">${pill(is.ncr_open,'bad')}</td></tr>
      <tr><td>RFIs open</td><td class="num">${pill(is.rfi_open,'warn')}</td></tr>
      <tr><td>Punch items open</td><td class="num">${pill(is.punch_open,'warn')}</td></tr>
      <tr><td>Constraints blocking</td><td class="num">${pill(is.constraints_open,'bad')}</td></tr></table>
    </div>
  </div>`;
};
function kpiCard(n,l,s,c){return `<div class="card kpi"><div class="n" style="color:${c}">${n}</div><div class="l">${l}</div><div class="s" style="color:var(--soft)">${s}</div></div>`;}

V["Reconciliation"]=()=>{
  let rows=DATA.areas.map(a=>{const d=a.fin-a.fis;const flag=Math.abs(d)>=20;
    return `<tr class="${flag?'flag':''}"><td>${a.name}</td>
      <td class="num" style="color:var(--green)">${a.fis}%</td>
      <td class="num" style="color:var(--amber)">${a.fin}%</td>
      <td class="num" style="color:${flag?'var(--red)':'var(--soft)'}">${d>0?'+':''}${d} pp</td>
      <td>${flag?pill('⚠ DISCREPANCY','bad'):pill('reconciled','ok')}</td></tr>`;}).join('');
  return `<h2>Physical vs financial reconciliation <span>· the gate</span></h2>
  <p class="sub">Every number carries its owner and its tag. When financial runs more than 20 points ahead of physical, the system flags it — the missing check from whoever is closest to reality.</p>
  <div class="card"><table><tr><th>Area</th><th class="num">Physical (site)</th><th class="num">Financial (ledger/GC)</th><th class="num">Delta</th><th>Status</th></tr>${rows}</table></div>
  <div class="callout" style="margin-top:14px">Electrical Room 1 trips the alarm: the GC bills 40% but site only verifies 25% installed (switchboards still in the factory). The 80% cost spent is advance + commitment, not physical progress. Without the system, that 40% went into the client report unquestioned.</div>`;
};

V["Progress"]=()=>{
  const opts=DATA.areas.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  return `<h2>Progress by area <span>· down to the line (granular unit)</span></h2>
  <div class="row-fx" style="margin-bottom:12px"><span class="sub">Area:</span> <select id="areasel" onchange="renderLines(this.value)">${opts}</select>
  <span class="sub" style="margin-left:auto">Every progress figure hangs off the line, with a credit rule (units/steps) — not "by eye".</span></div>
  <div id="lineswrap"></div>`;
};
function renderLines(aid){
  const ls=DATA.lines[aid]||[]; const pkgs=DATA.packages.filter(p=>p.area===aid);
  let prows=pkgs.map(p=>`<tr><td>${p.id}</td><td>${p.type}</td>
     <td>${p.released?pill('released','ok'):pill(p.constraints+' constraint(s): '+(p.cnote||''),'bad')}</td></tr>`).join('');
  let lrows=ls.map(l=>{const [nm,disc,uom,plan,inst,method]=l;const v=Math.round(inst/plan*100);
    return `<tr><td>${nm}</td><td>${pill(disc,'mut')}</td><td class="num">${inst}/${plan} ${uom}</td>
     <td style="width:180px"><div class="row-fx">${bar(v)}<span class="num" style="min-width:38px">${v}%</span></div></td>
     <td><span class="pill mut">${method}</span></td></tr>`;}).join('');
  document.getElementById('lineswrap').innerHTML=`
   <div class="card" style="margin-bottom:14px"><h3>AWP packages · crediting (constraint-free)</h3>
     <table><tr><th>Package</th><th>Type</th><th>Release status</th></tr>${prows}</table></div>
   <div class="card"><h3>Lines · verified physical progress</h3>
     <table><tr><th>Line (product)</th><th>Discipline</th><th class="num">Installed / plan</th><th>Progress</th><th>Credit rule</th></tr>${lrows}</table></div>`;
}

V["Cost / EVM"]=()=>{
  let tot={bud:0,com:0,act:0,eac:0};
  let rows=DATA.costcodes.map(c=>{tot.bud+=c.bud;tot.com+=c.com;tot.act+=c.act;tot.eac+=c.eac;
    const vac=c.bud-c.eac;
    return `<tr><td>${c.cc}</td><td class="num">${money(c.bud)}</td><td class="num">${money(c.com)}</td>
     <td class="num">${money(c.act)}</td><td class="num">${money(c.eac)}</td>
     <td class="num" style="color:${vac<0?'var(--red)':'var(--green)'}">${vac<0?'':'+'}${money(vac)}</td></tr>`;}).join('');
  const vact=tot.bud-tot.eac;
  return `<h2>Cost Management + EVM <span>· budget → commitment → actual → forecast</span></h2>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card" style="text-align:center">${gauge(DATA.kpi.cpi,'CPI = EV/AC',DATA.kpi.cpi>=1?'#4fbf8b':'#e56a6a')}<div class="sub" style="text-align:center">Cost efficiency</div></div>
    <div class="card" style="text-align:center">${gauge(DATA.kpi.spi,'SPI = EV/PV',DATA.kpi.spi>=1?'#4fbf8b':'#e8a13a')}<div class="sub" style="text-align:center">Schedule efficiency</div></div>
    <div class="card"><h3>Totals (USD thousands)</h3><table>
      <tr><td>Budget (BAC)</td><td class="num">${money(tot.bud)}</td></tr>
      <tr><td>Committed</td><td class="num">${money(tot.com)}</td></tr>
      <tr><td>Actual spent</td><td class="num">${money(tot.act)}</td></tr>
      <tr><td>Forecast (EAC)</td><td class="num">${money(tot.eac)}</td></tr>
      <tr><td>Variance at completion (VAC)</td><td class="num" style="color:${vact<0?'var(--red)':'var(--green)'}">${vact<0?'':'+'}${money(vact)}</td></tr></table></div>
  </div>
  <div class="card"><h3>By cost code</h3><table>
    <tr><th>Cost code</th><th class="num">Budget</th><th class="num">Committed</th><th class="num">Actual</th><th class="num">EAC</th><th class="num">VAC</th></tr>${rows}</table></div>`;
};

V["Quality"]=()=>{
  const cell=(s)=>s==='ok'?pill('✓','ok'):pill('pending','warn');
  let rows=DATA.commx.map(c=>`<tr><td>${c.sys}</td><td>${cell(c.L1)}</td><td>${cell(c.L2)}</td><td>${cell(c.L3)}</td><td>${cell(c.L4)}</td><td>${cell(c.L5)}</td></tr>`).join('');
  return `<h2>Quality · Commissioning L1–L5 <span>· a system isn't done until the IST (L5)</span></h2>
  <div class="card"><h3>Test matrix by system</h3>
   <table><tr><th>System / equipment</th><th>L1 FAT</th><th>L2 SAT</th><th>L3 Pre-func</th><th>L4 Functional</th><th>L5 IST</th></tr>${rows}</table>
   <div class="legend">Physical progress reaches 100% at installation; the system is only considered complete once it passes <b>L5 (Integrated Systems Test)</b> — with all punch items closed.</div></div>
  <div class="grid g3" style="margin-top:14px">
    ${kpiCard(DATA.issues.ncr_open,'NCRs open','non-conformances','var(--red)')}
    ${kpiCard(DATA.issues.rfi_open,'RFIs open','technical questions','var(--amber)')}
    ${kpiCard(DATA.issues.punch_open,'Punch items open','handover pending','var(--amber)')}
  </div>`;
};

V["Contractors"]=()=>{
  let rows=DATA.gcs.map(g=>{const bad=g.recon!=='reconciled';
    return `<tr class="${bad?'flag':''}"><td>${g.gc}</td><td>${g.est}</td><td>${g.period}</td>
     <td class="num">${money(g.monto)}</td><td>${pill('CFDI '+g.cfdi,'ok')}</td>
     <td>${bad?pill('⚠ '+g.recon,'bad'):pill(g.recon,'ok')}</td></tr>${bad?`<tr><td colspan="6" class="sub" style="color:var(--amber)">↳ ${g.note}</td></tr>`:''}`;}).join('');
  return `<h2>Contractors (GC) · Billing <span>· estimate → backup → CFDI → reconciliation</span></h2>
  <p class="sub">GCs upload their estimate and CFDI invoice through the portal (Power Pages). The system ties the invoice to the estimate and reconciles it against verified physical progress — it doesn't accept it blindly.</p>
  <div class="card"><table><tr><th>Contractor</th><th>Estimate</th><th>Period</th><th class="num">Amount</th><th>Invoice</th><th>Reconciliation</th></tr>${rows}</table></div>`;
};

// ---- nav ----
const tabs=Object.keys(V); let cur=tabs[0];
const nav=document.getElementById('nav');
tabs.forEach(t=>{const b=$(`<button>${t}</button>`);b.onclick=()=>{cur=t;draw();};b.dataset.t=t;nav.appendChild(b);});
function draw(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
  document.getElementById('view').innerHTML=V[cur]();
  if(cur==='Progress'){renderLines(DATA.areas[0].id);}}
draw();
</script></body></html>
