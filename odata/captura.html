<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captura ODATA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
  :root {
    --ink: #121418;
    --muted: #66717d;
    --line: #d7e3e0;
    --paper: #eef5f2;
    --panel: #ffffff;
    --teal: #0a8f8a;
    --shadow: 0 14px 34px rgba(22,27,34,0.075);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e2e8f0; --muted: #94a3b8; --line: #2d3748;
      --paper: #0f1319; --panel: #1a202c; --teal: #38d9a9;
      --shadow: 0 14px 34px rgba(0,0,0,0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e2e8f0; --muted: #94a3b8; --line: #2d3748;
    --paper: #0f1319; --panel: #1a202c; --teal: #38d9a9;
    --shadow: 0 14px 34px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
    background:
      linear-gradient(90deg, rgba(18,20,24,0.035) 1px, transparent 1px),
      linear-gradient(180deg, rgba(18,20,24,0.035) 1px, transparent 1px),
      var(--paper);
    background-size: 34px 34px;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  .wrap {
    width: 100%;
    max-width: 860px;
    padding: 48px 0 64px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--teal); }
  .sub {
    margin: 0;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.5;
  }
  textarea {
    width: 100%;
    min-height: 55vh;
    padding: 20px;
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.82rem;
    line-height: 1.65;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
    tab-size: 2;
  }
  textarea:focus { border-color: var(--teal); }
  textarea::placeholder { color: var(--muted); opacity: 0.6; }
  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 9px 22px;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    color: #fff;
    background: var(--teal);
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn.outline {
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
  }
  .btn.outline:hover { color: var(--ink); border-color: var(--muted); }
  .status {
    font-size: 0.78rem;
    color: var(--muted);
    margin-left: auto;
  }
  .count {
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1><span>ODATA</span> · Captura</h1>
  <p class="sub">Pega aquí la información que necesites guardar. Sin límite de caracteres. Se guarda automáticamente en el navegador.</p>

  <textarea id="cap" placeholder="Pega aquí tu contenido..."></textarea>

  <div class="bar">
    <button class="btn" onclick="saveNow()">Guardar</button>
    <button class="btn outline" onclick="copyAll()">Copiar todo</button>
    <button class="btn outline" onclick="clearAll()">Limpiar</button>
    <span class="count" id="count">0 caracteres</span>
    <span class="status" id="status"></span>
  </div>
</div>

<script>
  const ta = document.getElementById('cap');
  const st = document.getElementById('status');
  const ct = document.getElementById('count');
  const KEY = 'odata_captura_v1';
  let timer = null;

  function load() {
    try {
      const saved = localStorage.getItem(KEY);
      if (saved) ta.value = saved;
    } catch(e) {}
    updateCount();
  }

  function saveNow() {
    try {
      localStorage.setItem(KEY, ta.value);
      flash('Guardado');
    } catch(e) {
      flash('Error al guardar');
    }
  }

  function autoSave() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      try {
        localStorage.setItem(KEY, ta.value);
        flash('Autoguardado');
      } catch(e) {}
    }, 800);
    updateCount();
  }

  function copyAll() {
    if (!ta.value) return flash('Nada que copiar');
    navigator.clipboard.writeText(ta.value).then(
      () => flash('Copiado al portapapeles'),
      () => { ta.select(); flash('Seleccionado — usa Ctrl+C'); }
    );
  }

  function clearAll() {
    ta.value = '';
    try { localStorage.removeItem(KEY); } catch(e) {}
    updateCount();
    flash('Limpiado');
  }

  function flash(msg) {
    st.textContent = msg;
    setTimeout(() => { st.textContent = ''; }, 2500);
  }

  function updateCount() {
    const n = ta.value.length;
    ct.textContent = n.toLocaleString('es-MX') + ' caracteres';
  }

  ta.addEventListener('input', autoSave);
  load();
</script>
</body>
</html>
